# Renders metrics-dark.svg and metrics-light.svg every day.
# No third-party actions and no pip installs: just git and the runner's python3.
name: metrics

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["metrics/**", ".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo

      - name: Render
        working-directory: repo
        env:
          METRICS_TOKEN: ${{ secrets.METERICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
          PAGESPEED_TOKEN: ${{ secrets.PAGESPEED_TOKEN }}
        run: python3 metrics/render.py

      # Always commits, because the footer carries the render time. The daily
      # commit is also what stops GitHub disabling this schedule for inactivity.
      - name: Commit
        working-directory: repo
        # If main moved while rendering, re-apply the new files on top and retry.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$RUNNER_TEMP/metrics-out"
          mkdir -p "$out"
          cp metrics-dark.svg metrics-light.svg metrics/palette.json "$out/"
          for attempt in 1 2 3; do
            git fetch -q --depth 1 origin main
            git reset -q --hard origin/main
            cp "$out"/metrics-*.svg .
            cp "$out/palette.json" metrics/
            git add metrics-dark.svg metrics-light.svg metrics/palette.json
            git commit -q -m "Update metrics" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
